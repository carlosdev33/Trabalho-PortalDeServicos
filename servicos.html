<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/estilo.css">

    <title>Serviços Oferecidos - Portal de Orientação para Carreiras em Tecnologia</title>
    <link rel="icon" href="img/logo-portal.ico">

</head>

<body>

    <header>

        <h1>Portal de Orientação para Carreiras em Tecnologia</h1>

        <p>Um guia completo para sua Carreira em Tecnologia</p>

    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section class="servicosdisponiveis">
            <h2 class="servicos">Serviços Disponíveis</h2>
            <p class="servicos">Escolha uma opção para conhecer os serviços do Portal.</p>
        </section>

        <section class="catalogo-servicos" aria-label="Catálogo de serviços">
            <div class="painel-filtro" aria-label="Filtros de serviços">
                <label id="rotuloFiltroCategoria" for="botaoFiltroCategoria">Filtrar serviços por categoria:</label>
                <div class="linha-filtro">
                    <div class="filtro-personalizado" id="filtroPersonalizado">
                        <select id="filtroCategoria" name="filtroCategoria" class="select-acessivel" tabindex="-1" aria-hidden="true">
                            <option value="todos">Todos os serviços</option>
                            <option value="perfil">Perfil tecnológico</option>
                            <option value="carreiras">Carreiras</option>
                            <option value="aprendizagem">Cursos e aprendizagem</option>
                            <option value="outros">Outros serviços (sem resultados)</option>
                        </select>
                        <button type="button" class="filtro-seletor" id="botaoFiltroCategoria"
                            aria-labelledby="rotuloFiltroCategoria textoFiltroSelecionado" aria-haspopup="listbox"
                            aria-expanded="false" aria-controls="opcoesFiltroCategoria">
                            <span id="textoFiltroSelecionado">Todos os serviços</span>
                            <svg class="filtro-seta" viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5" /></svg>
                        </button>
                        <div class="filtro-opcoes" id="opcoesFiltroCategoria" role="listbox"
                            aria-labelledby="rotuloFiltroCategoria" hidden>
                            <button type="button" class="filtro-opcao selecionada" role="option" aria-selected="true" data-value="todos"><span>Todos os serviços</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8" /></svg></button>
                            <button type="button" class="filtro-opcao" role="option" aria-selected="false" data-value="perfil"><span>Perfil tecnológico</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8" /></svg></button>
                            <button type="button" class="filtro-opcao" role="option" aria-selected="false" data-value="carreiras"><span>Carreiras</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8" /></svg></button>
                            <button type="button" class="filtro-opcao" role="option" aria-selected="false" data-value="aprendizagem"><span>Cursos e aprendizagem</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8" /></svg></button>
                            <button type="button" class="filtro-opcao" role="option" aria-selected="false" data-value="outros"><span>Outros serviços</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-8" /></svg></button>
                        </div>
                    </div>
                    <p id="mensagemFiltro" aria-live="polite"></p>
                </div>
            </div>
            <div class="container-servicos" id="listaServicos" aria-label="Lista de serviços"></div>
        </section>

    </main>

    <footer>

        <p>Trabalho - Projeto - Desenvolvimento de Portal de Serviços - Programação Web - Front-End</p>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
