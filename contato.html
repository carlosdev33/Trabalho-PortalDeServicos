<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilo.css">
    <title>Contato - Portal de Orientação para Carreiras em Tecnologia</title>
    <link rel = "icon" href="img/logo-portal.ico">

</head>

<body>

    <header>
    
    <h1>Portal de Orientação para Carreiras em Tecnologia</h1>

    <p>Um guia completo para sua Carreira em Tecnologia</p>

    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="servicos.html">Serviços</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>

        <section>

            <h2 class="contato">Entre em Contato</h2>

            <p class="contato">Preencha os campos abaixo.</p>

            <form>

                <label for = "nome">Nome:</label>
                <input type = "text" id = "nome" name = "nome" required>

                <label for = "email">E-mail:</label>
                <input type = "email" id = "email" name = "email" required>

                <label for = "assunto">Assunto:</label>

                <select id = "assunto" name = "assunto" required>

                    <option value = "" disabled selected>Selecione</option>
                    <option value = "duvida">Dúvida</option>
                    <option value = "solicitacao">Solicitação</option>
                    <option value = "sugestão">Sugestão</option>

                </select>

                <label for = "mensagem">Mensagem:</label>
                <textarea id = "mensagem" name = "mensagem" rows = "10" required></textarea>

                <button type = "submit">Enviar</button>

            </form>

        </section>

    </main>

    <footer>

        <p>Trabalho - Projeto - Desenvolvimento de Portal de Serviços - Programação Web - Front-End</p>

    </footer>

</body>
</html>
